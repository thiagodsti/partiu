name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend tests & lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check backend/

      - name: ty type check
        run: uv run ty check backend/

      - name: Run backend tests
        run: uv run pytest backend/tests/ -v --cov=backend --cov-report=xml --cov-fail-under=70

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  frontend:
    name: Frontend lint & type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: ESLint
        run: npm run lint
        working-directory: frontend

      - name: svelte-check (type check)
        run: npm run check
        working-directory: frontend

      - name: Vitest unit tests
        run: npm test
        working-directory: frontend

  e2e:
    name: E2E tests (Playwright)
    # Pinned, not ubuntu-latest: when -latest moved to 26.04, Playwright 1.58
    # had no Chromium build or dependency list for it and `playwright install
    # --with-deps` failed before a single test ran. Move this forward together
    # with a Playwright upgrade that lists the new release as supported.
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Install frontend dependencies & build
        run: npm ci && npm run build
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      # scripts/run_e2e.sh starts a server on a scratch database with the flags
      # the suite needs, waits for it, runs Playwright and stops it — the same
      # recipe a developer runs locally. Blocking: global setup creates every
      # account and the seeded trips, so nothing depends on pre-existing data.
      - name: Run e2e tests
        run: scripts/run_e2e.sh
        env:
          SECRET_KEY: "ci-test-secret-key-placeholder-32x"
          E2E_SERVER_LOG: ${{ github.workspace }}/server.log

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            server.log
          retention-days: 7

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build image
        run: docker build -t partiu:ci .

      - name: Smoke test (startup check)
        run: |
          docker run --rm -d \
            -e SECRET_KEY="ci-test-secret-key-placeholder-32x" \
            -e DISABLE_SCHEDULER="true" \
            --name partiu_ci \
            partiu:ci
          sleep 5
          docker logs partiu_ci
          docker inspect partiu_ci --format='{{.State.Running}}' | grep true
          docker stop partiu_ci
