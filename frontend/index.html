<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0c0d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f2f2f0" media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Partiu" />
    <meta name="description" content="Your personal flight tracker" />
    <link rel="manifest" href="/manifest.json" />
    <!-- The two faces that render above the fold: body text and the condensed
         display cut every page title and airport code is set in. The rest of
         the family is fetched by the stylesheet as it is needed. -->
    <link rel="preload" href="/fonts/barlow-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/barlow-condensed-700-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <title>Partiu</title>
    <!-- Paints the page ink before the stylesheet lands, so a dark install
         does not flash white on every cold start. -->
    <style>
      html { background: #0c0c0d; }
      @media (prefers-color-scheme: light) { html { background: #f2f2f0; } }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="initial-loader" style="display:flex;align-items:center;justify-content:center;min-height:100vh;">
        <svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" style="animation:spin 0.9s linear infinite;">
          <circle cx="20" cy="20" r="16" fill="none" stroke="#76766f" stroke-width="4" stroke-dasharray="80" stroke-dashoffset="60" stroke-linecap="round"/>
        </svg>
        <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
